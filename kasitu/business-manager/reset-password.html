<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>KASITU Webs | Reset Password</title>
<link rel="stylesheet" href="manager.css">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:20px">
  <section class="panel" style="width:min(430px,100%);padding:30px">
    <div class="brand" style="padding:0 0 24px">
      <div class="brand-mark">K</div>
      <div><strong>KASITU</strong><span>Business Manager</span></div>
    </div>
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1 style="margin:6px 0 8px">Set a new password</h1>
    <p style="color:var(--muted);font-size:13px;line-height:1.6">Choose a new password for your KASITU Business Manager account.</p>
    <form id="resetForm" style="display:grid;gap:14px;margin-top:22px">
      <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
      <div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password"></div>
      <button class="btn primary" id="saveButton" type="submit">Update password</button>
      <p id="resetMessage" role="status" aria-live="polite" style="font-size:12px;color:var(--muted);margin:2px 0 0"></p>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(() => {
  const form = document.getElementById('resetForm');
  const message = document.getElementById('resetMessage');
  const button = document.getElementById('saveButton');

  if (!window.supabase || !window.KASITU_SUPABASE_URL || !window.KASITU_SUPABASE_PUBLISHABLE_KEY) {
    message.textContent = 'Authentication could not be loaded.';
    return;
  }

  const client = window.supabase.createClient(
    window.KASITU_SUPABASE_URL,
    window.KASITU_SUPABASE_PUBLISHABLE_KEY
  );

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password !== confirm) {
      message.textContent = 'The passwords do not match.';
      return;
    }

    button.disabled = true;
    message.textContent = 'Updating password…';

    const { error } = await client.auth.updateUser({ password });

    if (error) {
      message.textContent = error.message || 'Could not update your password.';
      button.disabled = false;
      return;
    }

    await client.auth.signOut();
    message.textContent = 'Password updated successfully. Returning to login…';
    setTimeout(() => window.location.replace('login.html'), 900);
  });
})();
</script>
</body>
</html>
