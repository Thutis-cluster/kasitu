<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>KASITU Webs | Business Manager</title>
  <link rel="icon" type="image/png" sizes="512x512" href="../images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div><strong>KASITU</strong><span>Business Manager</span></div>
      </div>
      <nav class="nav" aria-label="Business Manager navigation">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="clients"><span>♙</span> Clients</button>
        <button class="nav-item" data-view="leads"><span>◎</span> Leads</button>
        <button class="nav-item" data-view="quotations"><span>▣</span> Quotations</button>
        <button class="nav-item disabled" type="button"><span>▤</span> Invoices <small>Next</small></button>
        <button class="nav-item disabled" type="button"><span>R</span> Payments <small>Next</small></button>
        <button class="nav-item disabled" type="button"><span>◆</span> Projects <small>Next</small></button>
        <button class="nav-item disabled" type="button"><span>⚒</span> Maintenance <small>Next</small></button>
        <button class="nav-item disabled" type="button"><span>−</span> Expenses <small>Next</small></button>
        <button class="nav-item disabled" type="button"><span>□</span> Documents <small>Next</small></button>
        <button class="nav-item disabled" type="button"><span>◈</span> Reports <small>Next</small></button>
        <button class="nav-item disabled" type="button"><span>⚙</span> Settings <small>Next</small></button>
      </nav>
      <div class="sidebar-footer">
        <div class="system-status"><i></i> Supabase connected</div>
        <button class="btn" id="signOutButton" type="button">Sign out</button>
        <a href="../index.html">← Back to KASITU Webs</a>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div><p class="eyebrow">KASITU WEBS</p><h1 id="pageTitle">Dashboard</h1></div>
        <div class="topbar-actions"><span class="mode-badge">PHASE 2 • QUOTATIONS</span></div>
      </header>
      <section class="content" id="appContent"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <h2 id="modalTitle">Add</h2>
      <form id="recordForm"></form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="manager.js" defer></script>
</body>
</html>
